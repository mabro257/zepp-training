<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12181D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trainingssteuerung</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF1F2; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6773; --line:#D3DADF;
  --run:#1F5FBF; --ride:#0E7C63; --indoor:#6C45C9; --other:#9AA4AD;
  --fatigue:#D9820B; --fit:#16202A; --pos:#2E8B57; --neg:#C23B3B; --warn-bg:#FFF4DC; --warn-ink:#6B4A00;
  --z1:#B9C6D1; --z2:#6FA3C8; --z3:#E4B43C; --z4:#E07A2E; --z5:#C23B3B;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12181D; --surface:#1A2229; --ink:#E6ECF0; --muted:#98A5AF; --line:#2C3740;
  --run:#5B93E6; --ride:#33B391; --indoor:#9C7BEA; --other:#6D7880;
  --fatigue:#F0A33A; --fit:#E6ECF0; --pos:#4FBF83; --neg:#E86060; --warn-bg:#3A2F12; --warn-ink:#F5D98A;
  --z1:#4A5864; --z2:#4F87B0;
}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
h2{font-size:1.45rem;line-height:1.15}
h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}

/* App-Rahmen */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px max(16px,calc((100vw - 1100px) / 2 + 16px)) 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.appbar h1{font-size:1.35rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .back{display:none;border:0;background:none;padding:6px 8px 6px 0;cursor:pointer;font-size:1rem;font-weight:500}
.appbar.detail .back{display:inline-flex;align-items:center;gap:4px}
#syncinfo{font-size:.78rem;text-align:right;line-height:1.25}
main{max-width:1100px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.banner{background:var(--warn-bg);color:var(--warn-ink);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:500}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.4}
nav.tabs a:focus-visible,.row:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--run);outline-offset:-2px}

section{margin-bottom:32px}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lead{font-size:.9rem;color:var(--muted);margin-bottom:12px;max-width:62ch}
.chartbox{position:relative;height:260px}
.chartbox.tall{height:300px}
.panel{background:var(--surface);border-radius:12px;padding:16px}

/* Heute */
.state{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,11vw,3.8rem);line-height:.95}
.state-sub{margin-top:8px;color:var(--muted);max-width:40ch}
.reasons{margin:12px 0 0;padding:0;list-style:none}
.reasons li{font-size:.92rem;color:var(--muted);padding:2px 0}
.reasons li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:middle}
.reasons li.neg{color:var(--neg)} .reasons li.pos{color:var(--pos)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.05}
.stat span{font-size:.75rem;color:var(--muted);line-height:1.2;display:block}
.session{border-left:5px solid var(--run);padding:4px 0 4px 16px}
.session .what{font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.05}
.session .how{font-size:1.05rem;margin-top:6px}
.session .why{margin:10px 0 0;padding:0;list-style:none}
.session .why li{font-size:.88rem;color:var(--muted);padding:2px 0}
.outlook{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.outlook div{border-top:3px solid var(--line);padding-top:6px;font-size:.85rem}
.outlook b{display:block;font-weight:600}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--ink)}
.recs{list-style:none;margin:0;padding:0}
.recs li{padding:12px 0;border-bottom:1px solid var(--line)}
.recs li:last-child{border-bottom:0}
.recs b{display:block;font-weight:600}
.recs span{font-size:.9rem;color:var(--muted);display:block;margin-top:2px}
.recs small{font-size:.78rem;color:var(--muted)}

/* Einheiten */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;font:500 .88rem var(--body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weekhead{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);padding:14px 2px 6px}
.list{background:var(--surface);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row .ic{width:10px;height:36px;border-radius:5px}
.row .t{font-weight:600;line-height:1.2}
.row .s{font-size:.82rem;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r b{font-family:var(--display);font-size:1.2rem;font-weight:600;display:block;line-height:1}
.row .r small{font-size:.72rem;color:var(--muted)}

/* Detail */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:14px 0 4px}
.kpis b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.05}
.kpis span{font-size:.75rem;color:var(--muted)}
.verdict{font-size:1.02rem;margin-top:10px;max-width:60ch}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.pager a{font-size:.9rem;text-decoration:none;padding:8px 0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:500 .85rem var(--body);background:transparent;color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.insights{list-style:none;margin:0;padding:0}
.insights li{padding:12px 0 12px 14px;border-left:3px solid var(--line);margin-bottom:8px}
.insights li.solid{border-left-color:var(--ink)}
.insights li.warn{border-left-color:var(--neg)}
.insights p{font-size:.93rem}
.insights small{display:block;margin-top:4px;color:var(--muted);font-size:.78rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.up{color:var(--pos)} .down{color:var(--neg)}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
.empty{padding:40px 0;max-width:52ch}
.empty h2{margin-bottom:10px}
.tablewrap{overflow-x:auto}
.grid2>div,.grid2>section{margin-bottom:28px}

/* Leistung */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--surface);border-radius:12px;padding:12px}
.card b{display:block;font-family:var(--display);font-size:1.55rem;font-weight:600;line-height:1.05}
.card span{font-size:.75rem;color:var(--muted);display:block}
.card small{font-size:.75rem}
.small{font-size:.85rem}
/* Stabi */
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;border-radius:999px;padding:9px 18px;font-size:.95rem;border:0;cursor:pointer}
.routine{margin-bottom:12px}
.routine.primary{box-shadow:inset 0 0 0 2px var(--ink)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.why1{margin-top:8px;font-size:.93rem}
.exlist{margin:12px 0 0;padding-left:20px;font-size:.92rem}
.exlist li{padding:3px 0}
.exlist li span{color:var(--muted);margin-left:6px}
.exlist a{color:inherit}
.streak{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;text-align:center}
.streak i{display:block;height:22px;border-radius:5px;background:var(--line)}
.streak .on i{background:var(--ride)}
.streak span{font-size:.7rem;color:var(--muted)}
.figbox{background:var(--surface);border-radius:14px;padding:8px;margin-bottom:14px}
.fig{width:100%;height:auto;max-height:280px;display:block}
.fig polyline{stroke-width:7}
.fig .near{stroke:var(--ink)}
.fig .torso{stroke:var(--ink);stroke-width:9}
.fig .far{stroke:var(--muted);opacity:.55}
.fig .head{fill:var(--ink)}
.cues{margin:10px 0;padding-left:20px}
.cues li{padding:3px 0}
.avoid{color:var(--neg);font-size:.92rem}
.player{max-width:560px;margin:0 auto}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ink)}
.pbar.thin{height:4px;margin:6px 0 10px}
.plmeta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin:6px 0 10px}
.plphase{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plphase.work{color:var(--pos)} .plphase.rest{color:var(--fatigue)}
.plside{color:var(--muted);margin-top:2px}
.plbig{font-family:var(--display);font-weight:700;font-size:4.2rem;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.plbig small{font-size:1.4rem;color:var(--muted);font-weight:600}
.plnext{font-size:.9rem;color:var(--muted)}
.plctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:16px}
.plctl button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:1.2rem;cursor:pointer}
.plctl .main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;font-size:1.1rem}
.pltog{display:flex;gap:8px;margin-top:10px;justify-content:center}
.pltog button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.85rem;color:var(--muted);cursor:pointer}
.pltog button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

@media (min-width:900px){
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .heute{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
  .kpis{grid-template-columns:repeat(6,1fr)}
  nav.tabs{top:0;bottom:auto;left:50%;transform:translateX(-50%);width:min(680px,70vw);height:var(--nav-h);padding:0;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}
  nav.tabs a{flex-direction:row;font-size:.9rem;gap:8px}
  .appbar{top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
  body{padding-top:var(--nav-h)}
  main{padding-bottom:48px}
}
@media (prefers-reduced-motion:no-preference){ .view{animation:in .18s ease-out} @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<header class="appbar" id="appbar">
  <button class="back" id="back" aria-label="Zurück zur Liste">‹ Einheiten</button>
  <h1 id="title">Heute</h1>
  <p id="syncinfo" class="muted"></p>
</header>
<main><div id="banner"></div><div id="view" class="view"></div></main>
<nav class="tabs" aria-label="Bereiche">
  <a href="#heute" data-tab="heute"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</a>
  <a href="#einheiten" data-tab="einheiten"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Einheiten</a>
  <a href="#fortschritt" data-tab="fortschritt"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Fortschritt</a>
  <a href="#analyse" data-tab="analyse"><svg viewBox="0 0 24 24"><path d="M20.8 11.2a8.8 8.8 0 1 1-8-8V12z"/><path d="M15 3.3A8.8 8.8 0 0 1 20.7 9H15z"/></svg>Analyse</a>
  <a href="#stabi" data-tab="stabi"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v6M7 10l5-1 5 1M12 13l-4 7M12 13l4 7"/></svg>Stabi</a>
</nav>

<script>
// ================= Konfiguration =================
// Laufband (Typ 8/11) ist kein Trainingsfokus: zählt zur Belastung, wird aber unter „Sonstiges“ geführt.
const SPORTS = {
  run:    { label: "Laufen",         types: ["1"],  color: "--run",    fam: "run" },
  ride:   { label: "Rad draußen",    types: ["9"],  color: "--ride",   fam: "bike" },
  indoor: { label: "Indoor-Cycling", types: ["10"], color: "--indoor", fam: "bike" },
  other:  { label: "Sonstiges",      types: [],     color: "--other",  fam: "other" },
};
const FOCUS = ["run", "ride", "indoor"];
const ZONES = ["Z1 Regeneration", "Z2 Grundlage", "Z3 Tempo", "Z4 Schwelle", "Z5 Maximal"];
const ZPCT = [.5, .6, .7, .8, .9, 1];

// ================= Helfer =================
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sportOf = (t) => Object.keys(SPORTS).find((k) => SPORTS[k].types.includes(String(t))) || "other";
const dayKey = (d) => d.toLocaleDateString("sv-SE");
const today = () => dayKey(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dayKey(d); };
const diffDays = (a, b) => Math.round((new Date(a + "T12:00:00") - new Date(b + "T12:00:00")) / 864e5);
const weekKey = (s) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dayKey(d); };
const fmtDate = (s, o = { day: "2-digit", month: "2-digit" }) => new Date(s + "T12:00:00").toLocaleDateString("de-DE", o);
const fmtDur = (sec) => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} h` : `${m} min`; };
const fmtH = (min) => min == null ? "–" : `${Math.floor(min / 60)}:${String(Math.round(min % 60)).padStart(2, "0")} h`;
const fmtPace = (s) => s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "–";
const nf = (v, d = 0) => v == null || !isFinite(v) ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const sg = (v, d = 0) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "±") + nf(Math.abs(v), d);
const round5 = (v) => Math.round(v / 5) * 5;
const clean = (a) => a.filter((v) => v != null && isFinite(v));
const mean = (a) => { a = clean(a); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
const median = (a) => { const s = clean(a).sort((x, y) => x - y); if (!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const sd = (a) => { a = clean(a); if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const quantile = (a, q) => { const s = clean(a).sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.floor(q * s.length))] : null; };
function welch(a, b, min = 5) {
  a = clean(a); b = clean(b);
  if (a.length < min || b.length < min) return null;
  const se = Math.sqrt(sd(a) ** 2 / a.length + sd(b) ** 2 / b.length), diff = mean(a) - mean(b);
  return { diff, t: se > 0 ? diff / se : 0, na: a.length, nb: b.length, ma: mean(a), mb: mean(b) };
}
const strength = (r) => r && Math.abs(r.t) >= 2 ? "belastbar" : "Tendenz";
const speedOf = (w) => w.distanceM && w.durationSec ? w.distanceM / w.durationSec : null; // m/s
const paceOf = (w) => w.paceSecKm || (w.distanceM ? w.durationSec / (w.distanceM / 1000) : null);
const tempoTxt = (w) => !w.distanceM ? "–" : SPORTS[w.sport].fam === "run" ? `${fmtPace(paceOf(w))} /km` : `${nf(speedOf(w) * 3.6, 1)} km/h`;

// ================= Pulsparameter aus Messwerten =================
// Max. Puls: je Einheit der höchste 15-s-Mittelwert der Pulskurve (glättet Sensor-Spitzen), sonst der Maximalpuls der Uhr.
// Gezählt wird der höchste Wert, den mindestens eine zweite Einheit bis auf 8 bpm bestätigt.
function robustMax(values) {
  const s = clean(values).filter((v) => v >= 120 && v <= 230).sort((a, b) => b - a);
  if (!s.length) return null;
  for (let i = 0; i < s.length - 1; i++) if (s[i] - s[i + 1] <= 8) return { value: Math.round(s[i]), n: s.length };
  return { value: Math.round(s[s.length - 1]), n: s.length };
}
const workoutMaxHr = (w) => w.hrSeries?.length ? Math.max(...w.hrSeries.map((x) => x[1])) : w.maxHr;
function deriveHr(ws, days) {
  const recent = ws.filter((w) => w.date >= addDays(today(), -730));
  const global = robustMax(recent.map(workoutMaxHr)) || { value: 190, n: 0, fallback: true };
  const byFam = { other: { ...global, own: false } };
  for (const f of ["run", "bike"]) {
    const vals = recent.filter((w) => SPORTS[w.sport].fam === f).map(workoutMaxHr);
    const r = clean(vals).length >= 8 ? robustMax(vals) : null;
    byFam[f] = r ? { ...r, own: true } : { ...global, own: false };
  }
  const rhrDates = Object.keys(days).filter((d) => days[d].rhr).sort();
  const globalRest = median(rhrDates.map((d) => days[d].rhr));
  const cache = {};
  const restAt = (date) => {
    if (cache[date] !== undefined) return cache[date];
    const from = addDays(date, -30);
    const vals = rhrDates.filter((d) => d > from && d <= date).map((d) => days[d].rhr);
    return (cache[date] = vals.length >= 5 ? median(vals) : globalRest);
  };
  const zoneBpm = (fam) => ZPCT.map((p) => Math.round(p * byFam[fam].value));
  return { global, byFam, restAt, globalRest, zoneBpm };
}
function baseline(days, date, key, win = 30) {
  const vals = [];
  for (let i = 1; i <= win; i++) { const v = days[addDays(date, -i)]?.[key]; if (v != null) vals.push(v); }
  if (vals.length < 7) return null;
  const m = median(vals);
  return { m, spread: Math.max(key === "rhr" ? 1.5 : 20, 1.4826 * median(vals.map((v) => Math.abs(v - m)))), n: vals.length };
}

// ================= Analytik =================
function prepare(data) {
  const days = data.days || {};
  const ws = data.workouts.filter((w) => w.start && w.durationSec);
  for (const w of ws) { w.sport = sportOf(w.type); w.date = dayKey(new Date(w.start * 1000)); if (w.te > 5) w.te /= 10; if (w.anaerobicTe > 5) w.anaerobicTe /= 10; }
  const hr = deriveHr(ws, days);
  const trimpF = (x) => x * 0.64 * Math.exp(1.92 * x);
  for (const w of ws) {
    const fam = SPORTS[w.sport].fam, max = hr.byFam[fam].value, rest = hr.restAt(w.date) ?? 60;
    w.hrMaxUsed = max; w.hrRestUsed = rest;
    const hrr = (h) => Math.min(1, Math.max(0, (h - rest) / (max - rest)));
    if (w.hrBins) {
      w.zones = [0, 0, 0, 0, 0]; w.load = 0;
      for (const [bin, sec] of Object.entries(w.hrBins)) {
        const h = Number(bin) + 2.5, p = h / max;
        w.zones[p < .6 ? 0 : p < .7 ? 1 : p < .8 ? 2 : p < .9 ? 3 : 4] += sec;
        w.load += (sec / 60) * trimpF(hrr(h));
      }
    } else {
      w.zones = null;
      w.load = w.avgHr ? (w.durationSec / 60) * trimpF(hrr(w.avgHr)) : 0;
    }
    const zt = w.zones ? w.zones.reduce((a, b) => a + b, 0) : 0;
    w.hardShare = zt ? (w.zones[3] + w.zones[4]) / zt : w.avgHr ? (w.avgHr / max >= .82 ? .5 : 0) : 0;
    w.easyShare = zt ? (w.zones[0] + w.zones[1]) / zt : w.avgHr ? (w.avgHr / max < .72 ? 1 : 0) : null;
    if (w.gapSeries) w.gapSpeed = mean(w.gapSeries.map(([, v]) => v));
    if (w.sport === "run" && w.avgHr && w.distanceM > 1000) w.ef = ((w.gapSpeed ? w.gapSpeed * 60 : w.distanceM / (w.durationSec / 60))) / w.avgHr;
    w.decoupling = decoupling(w);
  }
  const runs = ws.filter((w) => w.ef);
  runs.forEach((w, i) => {
    const prev = runs.slice(Math.max(0, i - 10), i).filter((p) => p.date >= addDays(w.date, -90)).map((p) => p.ef);
    w.efRes = prev.length >= 5 ? (w.ef / median(prev) - 1) * 100 : null;
  });
  const series = loadSeries(ws);
  const byDate = Object.fromEntries(series.map((d) => [d.date, d]));
  const hardThr = quantile(series.filter((d) => d.load > 0).map((d) => d.load), .8);
  for (const w of ws) {
    const d = byDate[addDays(w.date, -1)];
    w.tsbBefore = d ? d.ctl - d.atl : null;
    w.isHard = w.hardShare >= .15 || (hardThr && w.load >= hardThr);
  }
  for (const w of runs) w.tsb = byDate[w.date]?.tsb ?? null;
  const byId = Object.fromEntries(ws.map((w) => [w.id, w]));
  return { ws, days, hr, series, byDate, hardThr, byId };
}
// Aerobe Entkopplung (Pa:HR): Tempo je Herzschlag in der ersten gegen die zweite Hälfte,
// ohne die ersten 10 Minuten. Unter 5 % gilt die aerobe Ausdauer für diese Dauer als gut.
function decoupling(w) {
  if (!w.hrSeries || !w.speedSeries || w.sport === "indoor" || w.durationSec < 40 * 60) return null;
  const sp = Object.fromEntries(w.gapSeries || w.speedSeries);
  const pts = w.hrSeries.filter(([t]) => t >= 600 && sp[t] > .5).map(([t, h]) => [t, h, sp[t]]);
  if (pts.length < 40) return null;
  const mid = pts[Math.floor(pts.length / 2)][0];
  const ef = (a) => mean(a.map((p) => p[2])) / mean(a.map((p) => p[1]));
  const e1 = ef(pts.filter((p) => p[0] < mid)), e2 = ef(pts.filter((p) => p[0] >= mid));
  return e1 > 0 ? (e1 - e2) / e1 * 100 : null;
}

function loadSeries(ws) {
  if (!ws.length) return [];
  const perDay = {};
  for (const w of ws) perDay[w.date] = (perDay[w.date] || 0) + w.load;
  const out = []; let ctl = 0, atl = 0;
  for (let d = ws[0].date; d <= today(); d = addDays(d, 1)) {
    const load = perDay[d] || 0, tsb = ctl - atl;
    ctl += (load - ctl) / 42; atl += (load - atl) / 7;
    out.push({ date: d, load, ctl, atl, tsb });
  }
  return out;
}

function readiness(P) {
  const { days, series } = P;
  const last = series[series.length - 1];
  const l7 = mean(series.slice(-7).map((d) => d.load)), l28 = mean(series.slice(-28).map((d) => d.load));
  const acwr = l28 > 0 ? l7 / l28 : null;
  const t = today();
  const dRef = [t, addDays(t, -1)].find((d) => days[d]?.rhr || days[d]?.sleepMin) || null;
  const day = dRef ? days[dRef] : {};
  const bR = dRef ? baseline(days, dRef, "rhr") : null, bS = dRef ? baseline(days, dRef, "sleepMin") : null;
  const reasons = []; let score = 0, rhrDelta = null, sleepDelta = null, rhrZ = 0;
  if (day.rhr && bR) {
    rhrDelta = day.rhr - bR.m; rhrZ = rhrDelta / bR.spread;
    if (rhrZ >= 1.5) { score -= 2; reasons.push(["neg", `Ruhepuls ${nf(rhrDelta)} bpm über deinem Basiswert`]); }
    else if (rhrZ >= .75) { score -= 1; reasons.push(["neg", `Ruhepuls leicht erhöht (${sg(rhrDelta)} bpm)`]); }
    else if (rhrZ <= -.5) { score += .5; reasons.push(["pos", `Ruhepuls unter Basiswert (${sg(rhrDelta)} bpm)`]); }
    else reasons.push(["", "Ruhepuls im normalen Bereich"]);
  }
  if (day.sleepMin && bS) {
    sleepDelta = day.sleepMin - bS.m;
    if (sleepDelta <= -60) { score -= 1; reasons.push(["neg", `Schlaf ${fmtH(day.sleepMin)}, ${nf(-sleepDelta)} min unter deinem Schnitt`]); }
    else if (sleepDelta <= -30) { score -= .5; reasons.push(["neg", `Etwas kürzer geschlafen (${fmtH(day.sleepMin)})`]); }
    else if (sleepDelta >= 30) { score += .5; reasons.push(["pos", `Viel Schlaf (${fmtH(day.sleepMin)})`]); }
    else reasons.push(["", `Schlaf normal (${fmtH(day.sleepMin)})`]);
  }
  if (last.tsb < -30) { score -= 2; reasons.push(["neg", "Ermüdung liegt weit über der Fitness"]); }
  else if (last.tsb < -10) { score -= .5; reasons.push(["", "Produktive Belastungsphase"]); }
  else if (last.tsb > 5) { score += 1; reasons.push(["pos", "Frisch: Ermüdung unter Fitness"]); }
  if (acwr > 1.5) { score -= 1.5; reasons.push(["neg", `Belastungssprung: letzte 7 Tage ${nf(acwr, 1)}× so hoch wie der 4-Wochen-Schnitt`]); }
  const level = score >= 1 ? 3 : score > -1 ? 2 : score > -3 ? 1 : 0;
  const state = [["Ruhetag", "Mehrere Erholungssignale sind negativ."], ["Locker bleiben", "Heute nur Z1–Z2 oder kurz."],
    ["Normal trainieren", "Geplantes Training ist okay."], ["Bereit für hart", "Gute Voraussetzungen für eine Qualitätseinheit."]][level];
  return { level, state, reasons, rhr: day.rhr, rhrDelta, rhrZ, sleep: day.sleepMin, sleepDelta, last, acwr, dRef, hasDayData: !!(bR || bS) };
}

function buildInsights(P) {
  const { ws, days, series, hardThr } = P;
  const out = [];
  const hasDays = Object.values(days).some((d) => d.rhr);
  const rec = { hard: [[], [], []], ctrl: [], sleepHard: [], sleepCtrl: [], recoveryDays: null, shortSleepPenalty: null, rhrPenalty: null };
  if (hasDays && hardThr) {
    for (const d of series) {
      const b = baseline(days, d.date, "rhr"), bs = baseline(days, d.date, "sleepMin"), prev = P.byDate[addDays(d.date, -1)];
      if (d.load >= hardThr) {
        for (let k = 1; k <= 3; k++) { const r = days[addDays(d.date, k)]?.rhr; if (r && b) rec.hard[k - 1].push(r - b.m); }
        const s = days[addDays(d.date, 1)]?.sleepMin; if (s && bs) rec.sleepHard.push(s - bs.m);
      } else if (d.load === 0 && prev && prev.load === 0) {
        const r = days[addDays(d.date, 1)]?.rhr; if (r && b) rec.ctrl.push(r - b.m);
        const s = days[addDays(d.date, 1)]?.sleepMin; if (s && bs) rec.sleepCtrl.push(s - bs.m);
      }
    }
    const w1 = welch(rec.hard[0], rec.ctrl);
    if (w1) {
      const ctrlM = mean(rec.ctrl);
      const back = [0, 1, 2].find((i) => (mean(rec.hard[i]) ?? 99) - ctrlM <= .5);
      rec.recoveryDays = back === undefined ? 3 : back + 1;
      out.push({ cls: w1.t >= 2 ? "solid" : "", title: "Erholung nach harten Tagen",
        text: `Nach deinen härtesten 20 % der Trainingstage liegt der Ruhepuls in der Folgenacht ${nf(Math.abs(w1.diff), 1)} bpm ${w1.diff >= 0 ? "höher" : "niedriger"} als nach Ruhetagen. `
          + (back === undefined ? "Auch drei Tage später ist er noch erhöht." : back === 0 ? "Schon am nächsten Tag ist er wieder normal." : `Nach ${back + 1} Tagen ist er wieder auf Normalniveau.`),
        meta: `${strength(w1)}, ${w1.na} harte Tage gegen ${w1.nb} Ruhetage` });
    }
    const ws1 = welch(rec.sleepHard, rec.sleepCtrl);
    if (ws1 && Math.abs(ws1.diff) >= 10) out.push({ cls: Math.abs(ws1.t) >= 2 ? "solid" : "", title: "Schlaf nach harten Tagen",
      text: ws1.diff < 0 ? `Nach harten Tagen schläfst du im Schnitt ${nf(-ws1.diff)} min kürzer als nach Ruhetagen.` : `Nach harten Tagen schläfst du im Schnitt ${nf(ws1.diff)} min länger.`,
      meta: `${strength(ws1)}, ${ws1.na} gegen ${ws1.nb} Nächte` });
  }
  const runs = ws.filter((w) => w.efRes != null);
  const cond = [];
  if (hasDays) {
    const short = [], normal = [], high = [], low = [];
    for (const w of runs) {
      const bs = baseline(days, w.date, "sleepMin"), br = baseline(days, w.date, "rhr"), s = days[w.date]?.sleepMin, r = days[w.date]?.rhr;
      if (s && bs) (s - bs.m <= -45 ? short : normal).push(w.efRes);
      if (r && br) (r - br.m >= Math.max(3, br.spread) ? high : low).push(w.efRes);
    }
    const a = welch(normal, short, 4), b = welch(low, high, 4);
    if (a) { cond.push(["Schlaf normal", a.ma, a.na], ["Schlaf kurz", a.mb, a.nb]); if (a.t >= 2) rec.shortSleepPenalty = a.diff;
      out.push({ cls: Math.abs(a.t) >= 2 ? "solid" : "", title: "Schlaf und Laufökonomie",
        text: `Nach einer kurzen Nacht (mindestens 45 min unter deinem Schnitt) ist deine Laufökonomie ${nf(Math.abs(a.diff), 1)} % ${a.diff > 0 ? "schlechter" : "besser"} als nach normalem Schlaf.`,
        meta: `${strength(a)}, ${a.nb} Läufe nach kurzer gegen ${a.na} nach normaler Nacht` }); }
    if (b) { cond.push(["Ruhepuls normal", b.ma, b.na], ["Ruhepuls erhöht", b.mb, b.nb]); if (b.t >= 2) rec.rhrPenalty = b.diff;
      out.push({ cls: Math.abs(b.t) >= 2 ? "solid" : "", title: "Ruhepuls als Frühwarnsignal",
        text: `Ist dein Ruhepuls morgens erhöht, läufst du ${nf(Math.abs(b.diff), 1)} % ${b.diff > 0 ? "unökonomischer" : "ökonomischer"}.`,
        meta: `${strength(b)}, ${b.nb} gegen ${b.na} Läufe` }); }
  }
  const c = welch(runs.filter((w) => w.tsb != null && w.tsb >= 0).map((w) => w.efRes), runs.filter((w) => w.tsb != null && w.tsb < -15).map((w) => w.efRes), 4);
  if (c) { cond.push(["Form positiv", c.ma, c.na], ["Form unter −15", c.mb, c.nb]);
    out.push({ cls: Math.abs(c.t) >= 2 ? "solid" : "", title: "Form und Laufökonomie",
      text: `Mit positiver Form bist du ${nf(Math.abs(c.diff), 1)} % ${c.diff > 0 ? "ökonomischer" : "unökonomischer"} unterwegs als in stark ermüdeten Phasen.`,
      meta: `${strength(c)}, ${c.na} gegen ${c.nb} Läufe` }); }
  if (hasDays && series.length > 50) {
    const t = today(), s = series, ctlNow = s[s.length - 1].ctl, ctlThen = s[Math.max(0, s.length - 43)].ctl;
    const rNow = median([...Array(14)].map((_, i) => days[addDays(t, -i)]?.rhr)), rThen = median([...Array(14)].map((_, i) => days[addDays(t, -42 - i)]?.rhr));
    if (rNow && rThen && ctlThen > 0) {
      const dc = (ctlNow / ctlThen - 1) * 100, dr = rNow - rThen, up = dc > 5, down = dc < -5, rUp = dr >= 2, rDown = dr <= -1.5;
      const [cls, text] = up && rDown ? ["solid", "Fitness steigt, Ruhepuls sinkt: Das Training schlägt an."]
        : up && rUp ? ["warn", "Fitness und Ruhepuls steigen: Die Belastung wächst schneller als die Erholung."]
        : down && rUp ? ["warn", "Weniger Training, trotzdem höherer Ruhepuls: eher Stress, Schlaf oder Infekt."]
        : down && rDown ? ["", "Weniger Training, niedrigerer Ruhepuls: Erholungsphase."] : ["", "Fitness und Ruhepuls sind stabil."];
      rec.adaptation = cls;
      out.push({ cls, title: "Anpassung über 6 Wochen", text: `Fitness ${sg(dc)} %, Ruhepuls ${sg(dr, 1)} bpm. ${text}`, meta: "Letzte 14 Tage gegen dieselben 14 Tage vor 6 Wochen" });
    }
  }
  const w7 = series.slice(-7).map((d) => d.load), mono = sd(w7) > 0 ? mean(w7) / sd(w7) : null;
  rec.monotony = mono;
  if (mono > 2 && mean(w7) > 0) out.push({ cls: "warn", title: "Zu gleichförmige Woche", text: `Monotonie ${nf(mono, 1)}: an allen Tagen ähnliche Belastung ohne klare Ruhetage.`, meta: "Ø Tagesbelastung ÷ Streuung der letzten 7 Tage, über 2 gilt als riskant" });
  const withZ = ws.filter((w) => w.zones && w.date >= addDays(today(), -56));
  const zt = withZ.reduce((a, w) => (w.zones.forEach((s, i) => a[i] += s), a), [0, 0, 0, 0, 0]), zs = zt.reduce((a, b) => a + b, 0);
  const efRecent = mean(runs.filter((w) => w.date >= addDays(today(), -28)).map((w) => w.ef));
  const efOld = mean(runs.filter((w) => w.date < addDays(today(), -28) && w.date >= addDays(today(), -84)).map((w) => w.ef));
  if (zs > 0) { rec.easyShare = (zt[0] + zt[1]) / zs * 100; rec.midShare = zt[2] / zs * 100; rec.hardShare = (zt[3] + zt[4]) / zs * 100; }
  if (zs > 0 && efRecent && efOld) {
    rec.efTrend = (efRecent / efOld - 1) * 100;
    out.push({ cls: rec.efTrend < 1 && rec.easyShare < 70 ? "warn" : "", title: "Intensität und Fortschritt",
      text: `Letzte 8 Wochen: ${nf(rec.easyShare)} % locker, ${nf(rec.midShare)} % Tempo (Z3), ${nf(rec.hardShare)} % hart. Laufökonomie ${sg(rec.efTrend, 1)} % gegenüber den 8 Wochen davor.`,
      meta: `${withZ.length} Einheiten mit Pulsverlauf` });
  }
  const dec = ws.filter((w) => w.decoupling != null && (w.easyShare ?? 0) >= .7 && w.durationSec >= 45 * 60);
  const decNow = dec.filter((w) => w.date >= addDays(today(), -56)).map((w) => w.decoupling);
  if (decNow.length >= 3) {
    const m = median(decNow), before = median(dec.filter((w) => w.date < addDays(today(), -56)).map((w) => w.decoupling));
    rec.decoupling = m;
    out.push({ cls: m < 5 ? "solid" : "warn", title: "Aerobe Ausdauer",
      text: `Bei lockeren Einheiten ab 45 min sinkt dein Tempo je Herzschlag in der zweiten Hälfte um ${nf(m, 1)} %. ${m < 5 ? "Unter 5 %: Deine Grundlage trägt über diese Dauer." : "Über 5 %: Die Grundlage reicht für diese Dauer noch nicht, mehr lange lockere Einheiten helfen am meisten."}${before != null ? ` Vor 8 Wochen: ${nf(before, 1)} %.` : ""}`,
      meta: `Median aus ${decNow.length} Einheiten der letzten 8 Wochen, ohne die ersten 10 Minuten` });
  }
  return { out, rec, cond };
}

// ================= Leistung: steigungsbereinigt, Pace bei Puls, Bestleistungen =================
const PERF_D = [60, 180, 300, 600, 720, 1200, 1800, 3600];
const durLabel = (d) => d < 3600 ? `${d / 60} min` : `${d / 3600} h`;
const fmtClock = (sec) => { if (sec == null || !isFinite(sec)) return "–"; sec = Math.round(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`; };
const CS_ZONES = [0, .78, .88, .95, 1.02, 1.15]; // Anteil der Critical Speed je Zonengrenze

// Beste Durchschnittsgeschwindigkeit je Dauer (gleitendes Fenster über 15-s-Werte) samt Ø Puls im Fenster
function bestEfforts(w) {
  const ser = w.speedSeries; if (!ser || ser.length < 5) return null;
  const step = 15, t0 = ser[0][0], n = Math.round((ser[ser.length - 1][0] - t0) / step) + 1;
  const v = new Array(n).fill(null), h = new Array(n).fill(null);
  for (const [t, x] of ser) if (x > 0.8 && x < 7) v[Math.round((t - t0) / step)] = x;
  if (w.hrSeries) for (const [t, x] of w.hrSeries) { const i = Math.round((t - t0) / step); if (i >= 0 && i < n) h[i] = x; }
  const out = {};
  for (const D of PERF_D) {
    const k = D / step; if (k > n) continue;
    let sum = 0, nulls = 0, best = null;
    for (let i = 0; i < n; i++) {
      if (v[i] == null) nulls++; else sum += v[i];
      if (i >= k) { if (v[i - k] == null) nulls--; else sum -= v[i - k]; }
      if (i >= k - 1 && nulls <= Math.floor(k * .1)) {
        const avg = sum / (k - nulls);
        if (!best || avg > best.v) best = { v: avg, end: i };
      }
    }
    if (best) {
      const hs = h.slice(best.end - k + 1, best.end + 1);
      out[D] = { v: best.v, hr: mean(hs), id: w.id, date: w.date };
    }
  }
  return out;
}

// Pace bei festem Puls: lineare Regression Tempo ~ Puls im Bereich ±15 bpm, ab Minute 10.
// Nutzt das steigungsbereinigte Tempo, wenn vorhanden.
function paceAtHr(w, ref) {
  if (!w.hrSeries) return null;
  const src = w.gapSeries || w.speedSeries; if (!src) return null;
  const sp = Object.fromEntries(src);
  const pts = w.hrSeries.filter(([t, h]) => t >= 600 && sp[t] > 1.5 && sp[t] < 7 && Math.abs(h - ref) <= 15).map(([t, h]) => [h, sp[t]]);
  if (pts.length < 20) return null;
  const hs = pts.map((p) => p[0]), vs = pts.map((p) => p[1]);
  let v = null;
  if (sd(hs) >= 3 && Math.min(...hs) <= ref + 2 && Math.max(...hs) >= ref - 2) {
    const mh = mean(hs), mv = mean(vs); let num = 0, den = 0;
    for (const [h, x] of pts) { num += (h - mh) * (x - mv); den += (h - mh) ** 2; }
    const b = den > 0 ? num / den : 0;
    if (b > 0) v = mv + b * (ref - mh);
  }
  if (v == null) { const near = pts.filter((p) => Math.abs(p[0] - ref) <= 3); if (near.length >= 12) v = median(near.map((p) => p[1])); }
  return v > 1.5 && v < 7 ? 1000 / v : null;
}

function aggregateBests(runs) {
  const agg = {};
  for (const w of runs) if (w.best) for (const [D, b] of Object.entries(w.best)) if (!agg[D] || b.v > agg[D].v) agg[D] = b;
  return agg;
}

// Critical Speed: Distanz = CS × Zeit + D′ über die Bestleistungen von 3 bis 30 min
function criticalSpeed(bests, hrMax) {
  const use = [180, 300, 600, 720, 1200, 1800].filter((d) => bests[d]);
  const hard = (d) => bests[d].hr && bests[d].hr >= (d <= 300 ? .86 : .84) * hrMax;
  if (use.length >= 3 && use.some((d) => d <= 300) && use.some((d) => d >= 720)) {
    const xs = use, ys = use.map((d) => bests[d].v * d), mx = mean(xs), my = mean(ys);
    let num = 0, den = 0; xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
    const cs = num / den, dp = my - cs * mx;
    if (cs > 2 && cs < 6.5 && dp >= 30 && dp <= 600) {
      const hardN = use.filter(hard).length;
      return { cs, dprime: dp, method: "model", quality: hardN >= use.length - 1 ? "hoch" : hardN >= 2 ? "mittel" : "niedrig", used: use };
    }
  }
  const d = bests[1200] ? 1200 : bests[1800] ? 1800 : null;
  if (d) return { cs: bests[d].v * (d === 1200 ? .95 : .97), dprime: null, method: "estimate", quality: hard(d) ? "mittel" : "niedrig", used: [d] };
  return null;
}

function predictRaces(c) {
  if (!c) return null;
  const t5 = c.dprime != null ? (5000 - c.dprime) / c.cs : 5000 / (c.cs * 1.04);
  const riegel = (d) => t5 * Math.pow(d / 5000, 1.06);
  return { k5: t5, k10: riegel(10000), hm: riegel(21097.5) };
}

function bestKm(runs, k) {
  let best = null;
  for (const w of runs) {
    const s = w.splits; if (!s || s.length < k) continue;
    for (let i = 0; i + k <= s.length; i++) {
      const t = s.slice(i, i + k).reduce((a, x) => a + x.paceSec, 0);
      if (!best || t < best.t) best = { t, date: w.date, id: w.id };
    }
  }
  return best;
}

function perfAnalysis(P) {
  const runs = P.ws.filter((w) => w.sport === "run");
  for (const w of runs) w.best = bestEfforts(w);
  const hrMax = P.hr.byFam.run.value;
  // Referenzpuls dort, wo du tatsächlich läufst: Median der Ø-Pulse der letzten 90 Tage, ±10 bpm
  const mid = round5(median(runs.filter((w) => w.date > addDays(today(), -90)).map((w) => w.avgHr)) ?? .78 * hrMax);
  const refs = [mid - 10, mid, mid + 10];
  for (const w of runs) w.pah = Object.fromEntries(refs.map((r) => [r, paceAtHr(w, r)]));
  const t = today();
  const within = (from, to) => runs.filter((w) => w.date > from && w.date <= to);
  const bests90 = aggregateBests(within(addDays(t, -90), t));
  const bestsAll = aggregateBests(runs);
  const bests42 = aggregateBests(within(addDays(t, -42), t));
  const cs = criticalSpeed(bests90, hrMax);
  const csThen = criticalSpeed(aggregateBests(within(addDays(t, -132), addDays(t, -42))), hrMax);
  const pred = predictRaces(cs), predThen = predictRaces(csThen);
  // Prognoseverlauf: je Woche aus den Bestleistungen der 90 Tage davor
  const trend = lastWeeks(20).map((wk) => {
    const end = [addDays(wk, 6), t].sort()[0];
    const c = criticalSpeed(aggregateBests(within(addDays(end, -90), end)), hrMax);
    return { wk, k10: predictRaces(c)?.k10 ?? null, cs: c?.cs ?? null };
  });
  const zonesPace = cs ? CS_ZONES.map((f) => f > 0 ? 1000 / (f * cs.cs) : null) : null;
  const kmBests = [1, 3, 5, 10].map((k) => ({ k, b: bestKm(runs, k) })).filter((x) => x.b);

  // Erkenntnis: Pace bei festem Puls
  const insights = [];
  const ref = refs[1];
  const now = median(runs.filter((w) => w.date > addDays(t, -28)).map((w) => w.pah[ref]));
  const then = median(runs.filter((w) => w.date <= addDays(t, -56) && w.date > addDays(t, -112)).map((w) => w.pah[ref]));
  const nNow = runs.filter((w) => w.date > addDays(t, -28) && w.pah[ref]).length;
  if (now && then && nNow >= 2) {
    const d = now - then;
    insights.push({ cls: d < -3 ? "solid" : d > 3 ? "warn" : "", title: `Pace bei ${ref} bpm`,
      text: `Bei ${ref} bpm läufst du aktuell ${fmtPace(now)} /km, vor 2–4 Monaten waren es ${fmtPace(then)} /km (${d < 0 ? "−" : "+"}${nf(Math.abs(d))} s). ${d < -3 ? "Deine aerobe Leistungsfähigkeit steigt." : d > 3 ? "Bei gleichem Puls bist du langsamer. Häufige Gründe: Ermüdung, Hitze oder weniger Grundlagenvolumen." : "Stabil."}`,
      meta: `Steigungsbereinigt, Median aus ${nNow} Läufen der letzten 4 Wochen` });
  }
  if (cs) insights.push({ cls: cs.quality === "hoch" ? "solid" : "", title: "Schwellentempo",
    text: `Deine Critical Speed liegt bei ${fmtPace(1000 / cs.cs)} /km. Das entspricht etwa dem Tempo, das du 30–40 Minuten durchhalten kannst.${csThen ? ` Vor 6 Wochen: ${fmtPace(1000 / csThen.cs)} /km.` : ""}`,
    meta: cs.method === "model" ? `Modell aus deinen Bestleistungen über ${cs.used.map(durLabel).join(", ")} (letzte 90 Tage), Aussagekraft ${cs.quality}` : `Geschätzt aus deiner besten ${durLabel(cs.used[0])}-Leistung, Aussagekraft ${cs.quality}` });
  return { refs, bests90, bestsAll, bests42, cs, csThen, pred, predThen, trend, zonesPace, kmBests, insights };
}

const REST_SET = 30, REST_EX = 20, PREP_FIRST = 10, PREP_SIDE = 6;

function buildPhases(r) {
  const ph = [];
  r.items.forEach((it, ii) => {
    const ex = EX[it.ex], sets = it.sets || 1, sides = ex.sides ? ["links", "rechts"] : [null];
    for (let s = 1; s <= sets; s++) sides.forEach((side, si) => {
      const work = it.mode === "time" ? it.sec : Math.round(it.reps * ex.tempo);
      const prep = !ph.length ? PREP_FIRST : si > 0 ? PREP_SIDE : 0;
      if (prep) ph.push({ type: "prep", it, ex, set: s, sets, side, dur: prep, switch: si > 0 });
      ph.push({ type: "work", it, ex, set: s, sets, side, dur: work, ii });
      const lastSide = si === sides.length - 1, lastSet = s === sets, lastItem = ii === r.items.length - 1;
      if (lastSide && !(lastSet && lastItem)) {
        const nextEx = lastSet ? EX[r.items[ii + 1].ex] : ex;
        ph.push({ type: "rest", it, ex: nextEx, nextIt: lastSet ? r.items[ii + 1] : it, set: lastSet ? 1 : s + 1, side: nextEx.sides ? "links" : null, dur: lastSet ? REST_EX : REST_SET, sets: lastSet ? (r.items[ii + 1].sets || 1) : sets });
      }
    });
  });
  return ph;
}
const routineMin = (r) => Math.round(buildPhases(r).reduce((s, p) => s + p.dur, 0) / 60);

const LIMBS = [["far", ["s", "e2", "w2"]], ["far", ["p", "k2", "a2", "t2"]], ["torso", ["s", "p"]], ["near", ["p", "k1", "a1", "t1"]], ["near", ["s", "e1", "w1"]]];
function figSvg(id) {
  return `<svg class="fig" id="${id}" viewBox="0 -20 240 170" role="img" aria-label="Bewegungsanimation">
    <rect x="16" y="130" width="208" height="6" rx="3" fill="var(--line)"/>

    ${LIMBS.map(([c], i) => `<polyline class="${c}" data-i="${i}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}
    <circle class="head" r="9"/>
  </svg>`;
}
const ptOn = (pose, spec) => {
  if (spec.length === 1) return pose[spec[0]];
  const [a, b, f] = spec, A = pose[a], B = pose[b];
  return [A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f];
};
function drawFig(svg, ex, f, rollF = f) {
  if (!svg) return;
  const A = ex.A, B = { ...ex.A, ...(ex.B || {}) };
  if (!ex._vb) { // Ausschnitt an die Übung anpassen
    const pts = [...Object.values(A), ...Object.values(B), ...(ex.props || []).flatMap((p) => p.a ? [p.a, p.b] : [])];
    const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);
    const x0 = Math.min(16, Math.min(...xs) - 14), x1 = Math.max(224, Math.max(...xs) + 14), y0 = Math.min(...ys) - 18, y1 = 142;
    const hgt = Math.max(y1 - y0, 90);
    ex._vb = `${x0} ${y1 - hgt} ${x1 - x0} ${hgt}`;
  }
  if (svg.dataset.vb !== ex._vb) { svg.setAttribute("viewBox", ex._vb); svg.dataset.vb = ex._vb; }
  const pose = {}; for (const k in A) pose[k] = [A[k][0] + (B[k][0] - A[k][0]) * f, A[k][1] + (B[k][1] - A[k][1]) * f];
  svg.querySelectorAll("polyline").forEach((pl) => { pl.setAttribute("points", LIMBS[pl.dataset.i][1].map((k) => pose[k].join(",")).join(" ")); });
  const hd = svg.querySelector(".head"); hd.setAttribute("cx", pose.h[0]); hd.setAttribute("cy", pose.h[1]);
  svg.querySelector(".props").innerHTML = (ex.props || []).map((pr) => {
    if (pr.type === "roller") { const x = pr.a[0] + (pr.b[0] - pr.a[0]) * rollF, y = pr.a[1] + (pr.b[1] - pr.a[1]) * rollF; return `<circle cx="${x}" cy="${y}" r="7" fill="var(--indoor)" opacity=".85"/>`; }
    if (pr.type === "loop") { const [x, y] = ptOn(pose, pr.on); return `<ellipse cx="${x}" cy="${y}" rx="4" ry="8" fill="none" stroke="var(--z4)" stroke-width="3"/>`; }
    if (pr.type === "band") { const [x1, y1] = ptOn(pose, pr.from), [x2, y2] = ptOn(pose, pr.to); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--z4)" stroke-width="3.5" stroke-linecap="round"/>`; }
    return "";
  }).join("");
}
// Bewegungsverlauf 0..1 je Animationsart; t in Sekunden seit Start der Wiederholung bzw. Übung
function animF(ex, t) {
  const ease = (x) => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  if (ex.anim === "rep") { const c = (t % ex.tempo) / ex.tempo; return c < .4 ? ease(c / .4) : c < .6 ? 1 : ease(1 - (c - .6) / .4); }
  if (ex.anim === "stretch") return ease(Math.min(1, t / 3));
  if (ex.anim === "hold") return .8 + .2 * Math.sin(t * 1.2) * .5 + .1;
  if (ex.anim === "roll") { const c = (t % 4) / 4; return ease(c < .5 ? c * 2 : 2 - c * 2); }
  return 0;
}

// ---------- Protokoll (lokal im Browser) ----------
const LOG_KEY = "stabiLog";
const readLog = () => { try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch { return []; } };
const writeLog = (e) => { try { const l = readLog(); l.push(e); localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(-300))); } catch {} };

function stabiSuggestion() {
  const t = today(), y = addDays(t, -1);
  const log = readLog(), week = log.filter((e) => weekKey(e.date) === weekKey(t));
  const doneToday = log.some((e) => e.date === t);
  const runToday = P?.ws.some((w) => w.date === t && w.sport === "run");
  const longYesterday = P?.ws.some((w) => (w.date === y || w.date === t) && w.durationSec >= 75 * 60);
  const stabilWeek = week.filter((e) => e.id === "stabil").length;
  let id, why;
  if (doneToday) return { id: null, why: "Heute schon erledigt.", week };
  if (runToday) { id = "kurz"; why = "Du bist heute gelaufen: Jetzt lösen und die Hüfte kurz aktivieren."; }
  else if (longYesterday) { id = "loesen"; why = "Nach der langen Einheit: Hüftbeuger und TFL lösen."; }
  else if (R && R.level <= 1) { id = "loesen"; why = "Lockerer Tag: Mobilität statt Kraft."; }
  else if (stabilWeek < 2) { id = "stabil"; why = `Diese Woche ${stabilWeek} von 2 Krafteinheiten für die Hüfte.`; }
  else { id = "loesen"; why = "Kraftziel der Woche erreicht, heute nur lösen."; }
  return { id, why, week };
}

// ================= Trainingsempfehlung =================
function recommend(P, R, I) {
  const { ws, series, hr } = P, rec = I.rec, t = today();
  const last = series[series.length - 1];
  const recoveryDays = rec.recoveryDays ?? 2;
  const lastHard = [...ws].reverse().find((w) => w.isHard);
  const daysSinceHard = lastHard ? diffDays(t, lastHard.date) : 99;
  const wk = weekKey(t);
  const thisWeek = ws.filter((w) => weekKey(w.date) === wk);
  const hardThisWeek = thisWeek.filter((w) => w.isHard).length;
  const doneToday = ws.filter((w) => w.date === t);
  const recent56 = ws.filter((w) => w.date >= addDays(t, -56));
  const durOf = (s, q) => quantile(recent56.filter((w) => w.sport === s).map((w) => w.durationSec / 60), q);
  const z = { run: hr.zoneBpm("run"), bike: hr.zoneBpm("bike") };
  const zr = (fam, a, b) => `${z[fam][a]}–${z[fam][b]} bpm`;
  const csv = P.perf?.cs?.cs;
  const pr = (lo, hi) => csv ? ` bzw. ${fmtPace(1000 / (hi * csv))}–${fmtPace(1000 / (lo * csv))} /km` : "";

  // Wochenziel: Belastung halten bzw. moderat steigern (ACWR 0,8–1,3)
  const ctlWeek = last.ctl * 7;
  let factor = 1.08, weekMode = "Aufbau";
  if (R.acwr > 1.3 || last.tsb < -25 || rec.adaptation === "warn") { factor = .7; weekMode = "Entlastung"; }
  else if (rec.monotony > 2) { factor = 1; weekMode = "Halten"; }
  const weekTarget = Math.max(ctlWeek * factor, 1);
  const weekDone = thisWeek.reduce((s, w) => s + w.load, 0);
  const daysLeft = 7 - ((new Date().getDay() + 6) % 7);

  // Laufumfang: nicht mehr als +10 % gegenüber dem 4-Wochen-Schnitt
  const runKm = (from, to) => ws.filter((w) => w.sport === "run" && w.date >= from && w.date < to).reduce((s, w) => s + (w.distanceM || 0), 0) / 1000;
  const runKm4 = runKm(addDays(wk, -28), wk) / 4, runKmNow = runKm(wk, addDays(wk, 7));
  const runCap = runKm4 * 1.1;

  // Welche Sportart? Beinbelastung durch Laufen der letzten 3 Tage und Laufumfang der Woche
  const run3 = ws.filter((w) => w.sport === "run" && w.date >= addDays(t, -2)).reduce((s, w) => s + w.load, 0);
  const all3 = ws.filter((w) => w.date >= addDays(t, -2)).reduce((s, w) => s + w.load, 0);
  const runHeavy = runKm4 > 0 && runKmNow >= runCap * .9 || (all3 > 0 && run3 / all3 > .7 && run3 > 0);
  const hard14 = ws.filter((w) => w.isHard && w.date >= addDays(t, -14));
  const hardRunShare = hard14.length ? hard14.filter((w) => SPORTS[w.sport].fam === "run").length / hard14.length : 0;
  const weekend = [0, 6].includes(new Date().getDay());

  let s;
  const why = [];
  if (doneToday.length) {
    s = { kind: "done", what: "Heute schon trainiert", how: `${doneToday.map((w) => `${SPORTS[w.sport].label} ${fmtDur(w.durationSec)}`).join(", ")}. Regeneration steht jetzt im Vordergrund.`, color: "--other" };
  } else if (R.level === 0) {
    s = { kind: "rest", what: "Ruhetag", how: "Höchstens 20–30 min Spaziergang oder lockeres Ausrollen unter " + z.bike[1] + " bpm.", color: "--other" };
    why.push("Deine Erholungssignale sind heute klar negativ.");
  } else {
    const tooMuchHard = (rec.hardShare ?? 0) > 20;
    const canHard = R.level >= 2 && daysSinceHard >= recoveryDays && hardThisWeek < 2 && weekMode !== "Entlastung" && !tooMuchHard;
    if (canHard) {
      const fam = runHeavy ? "bike" : hardRunShare > .5 ? "bike" : "run";
      const sport = fam === "run" ? "run" : "indoor";
      let what, how;
      if ((rec.midShare ?? 0) > 25) { what = "Schwellenintervalle"; how = `4 × 8 min in Z4 (${zr(fam, 3, 4)}${fam === "run" ? pr(.97, 1.0) : ""}), 3 min locker dazwischen. Ein- und Auslaufen je 15 min in Z2 (${zr(fam, 1, 2)}).`; why.push(`Du verbringst ${nf(rec.midShare)} % der Zeit in Z3. Gezielte Schwellenarbeit bringt mehr als weiteres Tempo „dazwischen“.`); }
      else if ((rec.easyShare ?? 0) >= 75 && (rec.efTrend ?? 0) < 1.5) { what = "VO₂max-Intervalle"; how = `5 × 3 min in Z5 (ab ${z[fam][4]} bpm${fam === "run" ? pr(1.05, 1.1) : ""}), 3 min locker dazwischen. Ein- und Auslaufen je 15 min in Z2.`; why.push(`Viel Grundlage (${nf(rec.easyShare)} % locker), aber die Ökonomie stagniert. Ein kurzer, harter Reiz fehlt.`); }
      else { what = fam === "run" ? "Tempodauerlauf" : "Sweet-Spot-Intervalle"; how = fam === "run" ? `20–30 min am oberen Ende von Z3 bis Z4 (${z.run[2] + 8}–${z.run[3] + 5} bpm${pr(.9, .95)}), davor und danach 15 min Z2.` : `3 × 12 min bei ${z.bike[2] + 5}–${z.bike[3] + 3} bpm, 4 min locker dazwischen.`; why.push(rec.easyShare != null ? `Deine Intensitätsverteilung passt (${nf(rec.easyShare)} % locker). Eine Tempo-Einheit hält die Entwicklung am Laufen.` : "Noch keine Zonendaten, daher eine moderate Tempo-Einheit."); }
      s = { kind: "hard", what: `${what} · ${SPORTS[sport].label}`, how, color: SPORTS[sport].color };
      why.push(`Letzte harte Einheit vor ${daysSinceHard >= 99 ? "über zwei Wochen" : daysSinceHard + " Tagen"}. Du brauchst laut deinem Ruhepuls ${recoveryDays} Tag${recoveryDays > 1 ? "e" : ""} zur Erholung.`);
      if (fam === "bike" && runHeavy) why.push("Die Laufbelastung der letzten Tage ist hoch, auf dem Rad schonst du die Beine.");
      if (rec.shortSleepPenalty && R.sleepDelta != null && R.sleepDelta <= -45) why.push(`Achtung: Nach kurzen Nächten ist deine Laufökonomie im Schnitt ${nf(rec.shortSleepPenalty, 1)} % schlechter. Heute auf dem Rad oder später verschieben.`);
    } else {
      const long = weekend && R.level >= 2 && weekMode !== "Entlastung";
      const sport = runHeavy ? (weekend ? "ride" : "indoor") : (daysSinceHard <= 1 ? (weekend ? "ride" : "indoor") : "run");
      const fam = SPORTS[sport].fam;
      const base = durOf(sport, .5) ?? (fam === "run" ? 45 : 60), lng = durOf(sport, .8) ?? base * 1.5;
      const mins = long ? round5(Math.min(lng * 1.1, fam === "run" ? 150 : 240)) : round5(Math.max(30, R.level === 1 ? base * .75 : base));
      s = { kind: long ? "long" : "easy", what: `${long ? "Lange Grundlage" : "Lockere Grundlage"} · ${SPORTS[sport].label}`,
        how: `${mins} min in Z2 (${zr(fam, 1, 2)}${fam === "run" ? pr(.78, .86) : ""}).${long ? " Gleichmäßig, bei Anstiegen Tempo rausnehmen statt Puls hochzutreiben." : " Du solltest dich dabei problemlos unterhalten können."}`, color: SPORTS[sport].color };
      if (R.level === 1) why.push("Die Erholungssignale sprechen heute gegen hohe Intensität.");
      if (daysSinceHard < recoveryDays) why.push(`Letzte harte Einheit vor ${daysSinceHard} Tag${daysSinceHard === 1 ? "" : "en"}, du brauchst im Schnitt ${recoveryDays} Tag${recoveryDays > 1 ? "e" : ""} zur Erholung.`);
      if (hardThisWeek >= 2) why.push("Diese Woche hattest du schon zwei harte Einheiten, mehr bringt selten mehr.");
      if (weekMode === "Entlastung") why.push("Entlastungswoche: Belastung zuletzt zu stark gestiegen.");
      if (tooMuchHard) why.push(`${nf(rec.hardShare)} % deiner Trainingszeit der letzten 8 Wochen lagen in Z4–Z5. Das ist zu viel, mehr Grundlage bringt jetzt den größeren Fortschritt.`);
      if (runHeavy && fam === "bike") why.push("Laufumfang der Woche ist fast am Limit (+10 % zum Schnitt), deshalb Rad.");
      if (long) why.push(`Wochenende: Deine längeren Einheiten dieser Sportart dauern ${round5(lng)} min.`);
    }
  }

  // Ausblick: harte Tage im Abstand deiner Erholungszeit
  const outlook = [];
  let lastHardOffset = s?.kind === "hard" ? 0 : daysSinceHard >= 99 ? -99 : -daysSinceHard, hardCount = hardThisWeek + (s?.kind === "hard" ? 1 : 0);
  for (let i = 1; i <= 3; i++) {
    const d = addDays(t, i), wd = new Date(d + "T12:00:00").getDay();
    if (wd === 1) hardCount = 0;
    let txt;
    if (weekMode === "Entlastung") txt = i === 2 ? "Ruhetag" : "Locker Z1–Z2";
    else if (i - lastHardOffset >= recoveryDays && hardCount < 2 && i > 1) { txt = "Qualitätseinheit möglich"; lastHardOffset = i; hardCount++; }
    else if (i - lastHardOffset === 1 && lastHardOffset >= 0) txt = "Locker oder Ruhetag";
    else txt = [0, 6].includes(wd) ? "Lange Grundlage" : "Grundlage Z2";
    outlook.push({ d, txt });

  // Wochen- und Langfrist-Empfehlungen
  const recs = [];
  recs.push({ b: `Wochenziel ${weekMode}: ${nf(weekDone)} von ${nf(weekTarget)} Belastungspunkten`,
    s: weekDone >= weekTarget ? "Ziel erreicht. Restliche Tage locker oder frei." : `Noch ${nf(weekTarget - weekDone)} Punkte in ${daysLeft} Tag${daysLeft > 1 ? "en" : ""}.`,
    m: weekMode === "Aufbau" ? "Ziel: 8 % über deinem Fitnessniveau" : weekMode === "Entlastung" ? "Ziel: 30 % unter deinem Fitnessniveau" : "Ziel: Fitnessniveau halten", pct: Math.min(1, weekDone / weekTarget) });
  if (runKm4 > 0) recs.push({ b: `Laufumfang: ${nf(runKmNow, 1)} von max. ${nf(runCap, 1)} km`, s: runKmNow > runCap ? "Über der 10-%-Grenze. Weitere Einheiten auf dem Rad statt laufend." : "Mehr als 10 % pro Woche erhöht das Verletzungsrisiko für Sehnen und Knochen.", m: `4-Wochen-Schnitt ${nf(runKm4, 1)} km`, pct: Math.min(1, runKmNow / runCap) });
  if (rec.easyShare != null) recs.push({ b: rec.easyShare < 75 ? "Mehr locker, weniger mittel" : "Intensitätsverteilung passt",
    s: rec.easyShare < 75 ? `Nur ${nf(rec.easyShare)} % deiner Zeit sind locker. Lockere Einheiten konsequent unter ${z.run[2]} bpm (Laufen) bzw. ${z.bike[2]} bpm (Rad) halten.` : `${nf(rec.easyShare)} % locker, ${nf(rec.hardShare)} % hart. So weitermachen.`, m: "Letzte 8 Wochen, Richtwert rund 80 % locker" });
  if (rec.recoveryDays) recs.push({ b: `Mindestens ${rec.recoveryDays} Tag${rec.recoveryDays > 1 ? "e" : ""} zwischen harten Einheiten`, s: "So lange braucht dein Ruhepuls, um nach harten Tagen wieder auf Normalniveau zu kommen.", m: "Aus deinen Ruhepulsdaten abgeleitet" });
  if (rec.shortSleepPenalty) recs.push({ b: "Harte Läufe nicht nach kurzen Nächten", s: `Nach kurzem Schlaf bist du im Schnitt ${nf(rec.shortSleepPenalty, 1)} % unökonomischer. Harte Einheiten dann aufs Rad legen oder verschieben.`, m: "Aus deinen Lauf- und Schlafdaten abgeleitet" });
  if (rec.rhrPenalty) recs.push({ b: "Morgens den Ruhepuls prüfen", s: `Bei erhöhtem Ruhepuls läufst du ${nf(rec.rhrPenalty, 1)} % unökonomischer. Das ist dein verlässlichstes Signal, eine harte Einheit zu tauschen.`, m: "Aus deinen Lauf- und Ruhepulsdaten abgeleitet" });
  if (rec.monotony > 2) recs.push({ b: "Klare Ruhetage einbauen", s: "Deine Woche ist zu gleichförmig. Ein kompletter Ruhetag senkt das Überlastungsrisiko stärker als zwei halbe.", m: `Monotonie ${nf(rec.monotony, 1)}` });
  return { s, why, outlook, recs, z };
}

const zoneBandsPlugin = {
  id: "zoneBands",
  beforeDatasetsDraw(c, _a, o) {
    if (!o?.bands) return;
    const { ctx, chartArea: a, scales: { y } } = c;
    o.bands.forEach(([lo, hi, col]) => {
      const top = Math.max(a.top, y.getPixelForValue(hi)), bot = Math.min(a.bottom, y.getPixelForValue(lo));
      if (bot <= top) return;
      ctx.save(); ctx.globalAlpha = .16; ctx.fillStyle = col; ctx.fillRect(a.left, top, a.right - a.left, bot - top); ctx.restore();
    });
  },
};

function route() {
  const h = location.hash.replace(/^#/, "") || "heute";
  const [tab, id, id2] = h.split("/");
  const appbar = document.getElementById("appbar"), view = document.getElementById("view");
  const navTab = tab === "einheit" ? "einheiten" : tab;
  document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === navTab ? "page" : "false"));
  appbar.classList.toggle("detail", tab === "einheit");
  document.getElementById("back").textContent = "‹ Einheiten";
  destroyCharts(); plStop(); cancelAnimationFrame(previewRaf);
  view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
  if (tab === "stabi") {
    if (id === "play") viewPlayer(id2); else if (id === "ex") viewExercise(id2); else viewStabi();
    window.scrollTo(0, 0); return;
  }
  if (!P || !P.ws.length) { document.getElementById("title").textContent = "Trainingssteuerung"; view.innerHTML = emptyView(); return; }
  const titles = { heute: "Heute", einheiten: "Einheiten", fortschritt: "Fortschritt", analyse: "Analyse" };
  if (tab === "einheit" && P.byId[id]) viewDetail(P.byId[id]);
  else if (titles[tab]) { document.getElementById("title").textContent = titles[tab]; ({ heute: viewToday, einheiten: viewList, fortschritt: viewProgress, analyse: viewAnalysis })[tab](); }
  else { location.hash = "#heute"; return; }
  window.scrollTo(0, 0);
}

function hrNote() {
  const h = P.hr;
  return `Max. Puls Laufen ${h.byFam.run.value}${h.byFam.run.own ? "" : "*"}, Rad ${h.byFam.bike.value}${h.byFam.bike.own ? "" : "*"} bpm: höchster geglätteter Wert (15 s) aus ${h.global.n} Einheiten der letzten 2 Jahre, der von einer zweiten Einheit bestätigt wird.`
    + (h.byFam.run.own && h.byFam.bike.own ? "" : " * unter 8 Einheiten dieser Sportart, daher sportartübergreifend.")
    + (h.globalRest ? ` Ruhepuls: Median der Nachtwerte der letzten 30 Tage, aktuell ${nf(h.restAt(today()))} bpm.` : " Keine Ruhepuls-Daten, Belastung mit 60 bpm geschätzt.")
    + " Nie ausgereizter Maximalpuls lässt die Zonen zu niedrig ausfallen.";
}

function drawWeek() {
  const wk = weekKey(today()), prev = [1, 2, 3, 4].map((i) => addDays(wk, -7 * i));
  const agg = (list) => { const r = {}; for (const w of list) { const s = r[w.sport] ||= { n: 0, sec: 0, m: 0, load: 0 }; s.n++; s.sec += w.durationSec; s.m += w.distanceM || 0; s.load += w.load; } return r; };
  const cur = agg(P.ws.filter((w) => weekKey(w.date) === wk)), past = agg(P.ws.filter((w) => prev.includes(weekKey(w.date))));
  const delta = (c, p) => { if (!p) return ""; const d = (c - p) / p * 100; return ` <span class="${d >= 0 ? "up" : "down"}">${sg(d)} %</span>`; };
  const rows = Object.keys(SPORTS).filter((k) => cur[k] || past[k]).map((k) => {
    const c = cur[k] || { n: 0, sec: 0, m: 0, load: 0 }, p = past[k] || { n: 0, sec: 0, m: 0, load: 0 };
    return `<tr><td><span class="dot" style="background:var(${SPORTS[k].color})"></span>${SPORTS[k].label}</td><td class="num">${c.n}</td>
      <td class="num">${fmtDur(c.sec)}${delta(c.sec, p.sec / 4)}</td><td class="num">${c.m || p.m ? `${nf(c.m / 1000, 1)} km${delta(c.m, p.m / 4)}` : "–"}</td><td class="num">${nf(c.load)}${delta(c.load, p.load / 4)}</td></tr>`;
  }).join("");
  document.getElementById("tWeek").innerHTML = `<thead><tr><th>Sportart</th><th class="num">Anz.</th><th class="num">Zeit</th><th class="num">Distanz</th><th class="num">Belastung</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">Keine Einheiten in den letzten fünf Wochen.</td></tr>`}</tbody>`;
}

// ---------- Detail ----------
function viewDetail(w) {
  document.getElementById("title").textContent = `${SPORTS[w.sport].label}, ${fmtDate(w.date, { day: "numeric", month: "short" })}`;
  const fam = SPORTS[w.sport].fam, isRun = fam === "run";
  const day = P.days[w.date] || {}, bR = baseline(P.days, w.date, "rhr"), bS = baseline(P.days, w.date, "sleepMin");
  const similar = P.ws.filter((x) => x.id !== w.id && x.sport === w.sport && x.date >= addDays(w.date, -180) && x.date <= addDays(w.date, 30)
    && Math.abs(x.durationSec / w.durationSec - 1) <= .3 && Math.abs((x.easyShare ?? .5) - (w.easyShare ?? .5)) <= .35);
  const cmp = (f) => median(similar.map(f));
  const idx = P.ws.indexOf(w), prev = P.ws[idx - 1], next = P.ws[idx + 1];
  const zt = w.zones ? w.zones.reduce((a, b) => a + b, 0) : 0;

  // Einordnung aus kombinierten Daten
  const v = [];
  if (w.zones) v.push(w.isHard ? `Harte Einheit: ${nf((w.zones[3] + w.zones[4]) / zt * 100)} % der Zeit in Z4–Z5.` : w.easyShare >= .8 ? `Saubere Grundlageneinheit: ${nf(w.easyShare * 100)} % in Z1–Z2.` : `Mischeinheit: ${nf(w.zones[2] / zt * 100)} % in Z3. Für Grundlage zu hart, für einen echten Reiz zu locker.`);
  else if (w.avgHr) v.push(`Ø Puls bei ${nf(w.avgHr / w.hrMaxUsed * 100)} % deines Maximalpulses.`);
  if (w.efRes != null) v.push(`Laufökonomie ${sg(w.efRes, 1)} % gegenüber deinem Trend${Math.abs(w.efRes) >= 3 ? (w.efRes > 0 ? ", ein klar guter Tag." : ", deutlich unter Normalform.") : "."}`);
  if (w.decoupling != null) v.push(`Entkopplung ${nf(w.decoupling, 1)} %: ${w.decoupling < 5 ? "Tempo und Puls blieben bis zum Ende stabil." : w.decoupling < 10 ? "In der zweiten Hälfte kostete das Tempo spürbar mehr Puls." : "Deutlicher Leistungsabfall in der zweiten Hälfte, für diese Dauer fehlt noch Grundlage oder die Einheit war zu schnell begonnen."}`);
  const cond = [];
  if (day.rhr && bR && day.rhr - bR.m >= Math.max(3, bR.spread)) cond.push(`erhöhtem Ruhepuls (${sg(day.rhr - bR.m)} bpm)`);
  if (day.sleepMin && bS && day.sleepMin - bS.m <= -45) cond.push(`kurzer Nacht (${fmtH(day.sleepMin)})`);
  if (w.tsbBefore != null && w.tsbBefore < -15) cond.push(`hoher Ermüdung (Form ${sg(w.tsbBefore)})`);
  if (cond.length) v.push(`Gestartet mit ${cond.join(", ")}${w.efRes != null && w.efRes < -2 ? ", das erklärt die schwächere Ökonomie." : "."}`);
  else if (day.rhr || day.sleepMin) v.push("Erholungswerte am Morgen waren normal.");
  const simHr = cmp((x) => x.avgHr), simSpeed = cmp(speedOf);
  if (similar.length >= 3 && w.avgHr && simHr && speedOf(w) && simSpeed) {
    const dh = w.avgHr - simHr, dsp = (speedOf(w) / simSpeed - 1) * 100;
    v.push(`Gegenüber dem Median von ${similar.length} ähnlichen Einheiten der letzten 6 Monate: ${sg(dsp, 1)} % Tempo bei ${sg(dh)} bpm Puls.`);
  }

  const kpi = (b, s) => `<div><b>${b}</b><span>${s}</span></div>`;
  const gapKm = (x) => { if (!w.gapSeries || !x.cumSec) return null; const from = x.cumSec - x.paceSec; const v = mean(w.gapSeries.filter(([t]) => t >= from && t < x.cumSec).map(([, s]) => s)); return v ? 1000 / v : null; };
  const hasGap = isRun && w.gapSeries && w.splits?.some((x) => x.cumSec);
  document.getElementById("view").innerHTML = `
    <section>
      <div class="kpis">
        ${kpi(fmtDur(w.durationSec), "Dauer")}
        ${kpi(w.distanceM ? nf(w.distanceM / 1000, 2) + " km" : "–", "Distanz")}
        ${kpi(tempoTxt(w), isRun ? "Ø Pace" : "Ø Tempo")}
        ${isRun && w.gapSpeed ? kpi(fmtPace(1000 / w.gapSpeed) + " /km", "Pace steigungsbereinigt") : ""}
        ${kpi(w.avgHr ? `${w.avgHr}` : "–", `Ø Puls${w.maxHr ? `, max ${w.maxHr}` : ""}`)}
        ${kpi(nf(w.load), "Belastung")}
        ${kpi(w.te ? nf(w.te, 1) : "–", "Trainingseffekt")}
        ${w.ascentM ? kpi(nf(w.ascentM) + " m", "Anstieg") : ""}
        ${isRun && w.cadence ? kpi(nf(w.cadence), "Kadenz (Schritte/min)") : ""}
        ${w.vo2max ? kpi(nf(w.vo2max), "VO₂max") : ""}
        ${w.decoupling != null ? kpi(nf(w.decoupling, 1) + " %", "Entkopplung Pa:HR") : ""}
        ${w.kcal ? kpi(nf(w.kcal), "kcal") : ""}
      </div>
      <p class="verdict">${v.join(" ")}</p>
    </section>
    <section>
      <div class="sechead"><h2>Pulsverlauf</h2></div>
      ${w.hrSeries ? `<div class="chartbox tall"><canvas id="cHr" aria-label="Pulsverlauf über die Dauer der Einheit mit Pulszonen"></canvas></div>` : `<p class="muted">Kein Pulsverlauf für diese Einheit vorhanden${w.hrBins ? " (wird beim nächsten Sync nachgeladen)" : ""}.</p>`}
    </section>
    ${w.zones ? `<section><div class="sechead"><h2>Zeit in Zonen</h2></div><div class="chartbox"><canvas id="cWZones"></canvas></div></section>` : ""}
    ${w.splits && w.splits.length >= 2 ? `<section><div class="sechead"><h2>Kilometer</h2></div>
      <div class="chartbox"><canvas id="cSplits"></canvas></div>
      <div class="panel tablewrap" style="margin-top:12px"><table><thead><tr><th>km</th><th class="num">${isRun ? "Pace" : "Tempo"}</th>${hasGap ? `<th class="num">bereinigt</th>` : ""}<th class="num">Ø Puls</th>${isRun ? `<th class="num">Kadenz</th>` : ""}<th class="num">Zeit gesamt</th></tr></thead><tbody>
      ${w.splits.map((x) => `<tr><td>${x.km}</td><td class="num">${isRun ? fmtPace(x.paceSec) + " /km" : nf(3600 / x.paceSec, 1) + " km/h"}</td>${hasGap ? `<td class="num">${fmtPace(gapKm(x))}</td>` : ""}<td class="num">${x.hr ?? "–"}</td>${isRun ? `<td class="num">${x.cadence ?? "–"}</td>` : ""}<td class="num">${x.cumSec ? fmtDur(x.cumSec) : "–"}</td></tr>`).join("")}
      </tbody></table><p class="note">Nur volle Kilometer.${hasGap ? " „Bereinigt“: Pace auf flache Strecke umgerechnet." : ""}</p></div></section>` : ""}
    <section class="grid2">
      <div>
        <div class="sechead"><h2>Zustand am Tag</h2></div>
        <div class="panel tablewrap"><table><thead><tr><th>Wert</th><th class="num">Am Tag</th><th class="num">Dein Basiswert</th></tr></thead><tbody>
          <tr><td>Ruhepuls</td><td class="num">${day.rhr ? day.rhr + " bpm" : "–"}</td><td class="num">${bR ? nf(bR.m) + " bpm" : "–"}</td></tr>
          <tr><td>Schlaf der Nacht davor</td><td class="num">${fmtH(day.sleepMin)}</td><td class="num">${bS ? fmtH(bS.m) : "–"}</td></tr>
          <tr><td>Tiefschlaf</td><td class="num">${fmtH(day.deepMin)}</td><td class="num">–</td></tr>
          <tr><td>Form vor der Einheit</td><td class="num">${sg(w.tsbBefore)}</td><td class="num">–</td></tr>
        </tbody></table></div>
      </div>
      <div>
        <div class="sechead"><h2>Ähnliche Einheiten</h2></div>
        ${similar.length >= 3 ? `<div class="panel tablewrap"><table><thead><tr><th>Kennzahl</th><th class="num">Diese</th><th class="num">Median (${similar.length})</th></tr></thead><tbody>
          <tr><td>${isRun ? "Pace" : "Tempo"}</td><td class="num">${tempoTxt(w)}</td><td class="num">${simSpeed ? (isRun ? fmtPace(1000 / simSpeed) + " /km" : nf(simSpeed * 3.6, 1) + " km/h") : "–"}</td></tr>
          <tr><td>Ø Puls</td><td class="num">${w.avgHr ?? "–"}</td><td class="num">${nf(simHr)}</td></tr>
          <tr><td>Belastung</td><td class="num">${nf(w.load)}</td><td class="num">${nf(cmp((x) => x.load))}</td></tr>
          ${isRun ? `<tr><td>Ökonomie</td><td class="num">${nf(w.ef, 2)}</td><td class="num">${nf(cmp((x) => x.ef), 2)}</td></tr>` : ""}
        </tbody></table><p class="note">Gleiche Sportart, ±30 % Dauer, ähnliche Intensität, letzte 6 Monate.</p></div>` : `<p class="muted">Zu wenige vergleichbare Einheiten.</p>`}
      </div>
    </section>
    <nav class="pager" aria-label="Weitere Einheiten">
      ${prev ? `<a href="#einheit/${prev.id}">‹ ${SPORTS[prev.sport].label}, ${fmtDate(prev.date)}</a>` : "<span></span>"}
      ${next ? `<a href="#einheit/${next.id}">${SPORTS[next.sport].label}, ${fmtDate(next.date)} ›</a>` : "<span></span>"}
    </nav>`;

  const zb = P.hr.zoneBpm(fam);
  if (w.hrSeries) {
    const ser = w.hrSeries, sp = w.speedSeries ? Object.fromEntries(w.speedSeries) : null;
    const tempo = (v) => v > .5 ? (isRun ? 1000 / v : v * 3.6) : null;
    const sets = [{ label: "Puls", data: ser.map(([t, h]) => ({ x: t / 60, y: h })), borderColor: css("--neg"), borderWidth: 1.8, pointRadius: 0, tension: .2, yAxisID: "y" }];
    if (sp) sets.push({ label: isRun ? "Pace" : "Tempo", data: w.speedSeries.map(([t, v]) => ({ x: t / 60, y: tempo(v) })).filter((p) => p.y != null && (!isRun || p.y < 900)),
      borderColor: css(SPORTS[w.sport].color), borderWidth: 1.2, pointRadius: 0, tension: .3, yAxisID: "y2" });
    if (sp && isRun && w.gapSeries) sets.push({ label: "Pace steigungsbereinigt", data: w.gapSeries.map(([t, v]) => ({ x: t / 60, y: tempo(v) })).filter((p) => p.y != null && p.y < 900),
      borderColor: css("--ink"), borderDash: [4, 3], borderWidth: 1.2, pointRadius: 0, tension: .3, yAxisID: "y2" });
    mk("cHr", {
      type: "line", data: { datasets: sets },
      options: baseOpts({
        plugins: { legend: sp ? legendBottom : { display: false }, zoneBands: { bands: [0, 1, 2, 3, 4].map((i) => [zb[i], zb[i + 1], css(`--z${i + 1}`)]) },
          tooltip: { callbacks: { title: (i) => `Minute ${nf(i[0].parsed.x, 1)}`, label: (c) => c.dataset.yAxisID === "y2" ? (isRun ? `${c.dataset.label} ${fmtPace(c.parsed.y)} /km` : `${nf(c.parsed.y, 1)} km/h`) : `Puls ${c.parsed.y} bpm` } } },
        scales: {
          x: { type: "linear", title: ax("Minuten"), grid: { display: false }, ticks: { maxTicksLimit: 8, callback: (v) => nf(v) } },
          y: { title: ax("Puls (bpm)"), suggestedMin: zb[0] - 10, suggestedMax: zb[5] },
          ...(sp ? { y2: { position: "right", reverse: isRun, grid: { display: false }, title: ax(isRun ? "Pace (min/km)" : "Tempo (km/h)"), ticks: { callback: (v) => isRun ? fmtPace(v) : nf(v) } } } : {}),
        },
      }),
    });
  }
  if (w.splits && w.splits.length >= 2) {
    const sv = w.splits.map((x) => isRun ? x.paceSec : 3600 / x.paceSec);

    mk("cSplits", {
      data: { labels: w.splits.map((x) => String(x.km)), datasets: [
        { type: "line", label: isRun ? "Pace" : "Tempo", data: sv, borderColor: css(SPORTS[w.sport].color), backgroundColor: css(SPORTS[w.sport].color), borderWidth: 2.5, pointRadius: 4, tension: .2, yAxisID: "y", order: 2 },
        { type: "line", label: "Ø Puls", data: w.splits.map((x) => x.hr), borderColor: css("--neg"), borderWidth: 2, pointRadius: 3, yAxisID: "y2", order: 1 },
      ] },
      options: baseOpts({
        scales: {
          x: { title: ax("Kilometer"), grid: { display: false }, offset: true },
          y: { reverse: isRun, min: Math.max(0, lo - pad), max: hi + pad, title: ax(isRun ? "Pace (min/km)" : "Tempo (km/h)"), ticks: { callback: (v) => isRun ? fmtPace(v) : nf(v) } },
          y2: { position: "right", grid: { display: false }, title: ax("Ø Puls (bpm)") },
        },
        plugins: { legend: legendBottom, tooltip: { callbacks: { title: (i) => `Kilometer ${i[0].label}`, label: (c) => c.dataset.yAxisID === "y2" ? `Ø Puls ${c.parsed.y} bpm` : isRun ? `Pace ${fmtPace(c.parsed.y)} /km` : `${nf(c.parsed.y, 1)} km/h` } } },
      }),
    });
  }
  if (w.zones) {
    mk("cWZones", {
      type: "bar",
      data: { labels: ZONES.map((z, i) => `${z} (${zb[i]}–${zb[i + 1]})`), datasets: [{ label: "Minuten", data: w.zones.map((s) => s / 60), backgroundColor: [1, 2, 3, 4, 5].map((i) => css(`--z${i}`)) }] },
      options: baseOpts({ indexAxis: "y", plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${nf(c.parsed.x, 1)} min (${nf(c.parsed.x * 60 / zt * 100)} %)` } } },
        scales: { x: { title: ax("Minuten"), beginAtZero: true }, y: { title: ax("Zone (bpm)"), grid: { display: false } } } }),
    });
  }
}

}
function drawPah(ref) {
  charts.cPah?.destroy();
  const runs = P.ws.filter((w) => w.sport === "run" && w.pah?.[ref]).slice(-60);
  const note = document.getElementById("pahNote");
  if (runs.length < 2) { note.textContent = `Zu wenige Läufe mit Pulswerten um ${ref} bpm.`; return; }
  const y = runs.map((w) => w.pah[ref]), roll = y.map((_, i) => median(y.slice(Math.max(0, i - 4), i + 1)));
  note.textContent = `${runs.length} Läufe mit genügend Messpunkten um ${ref} bpm.`;
  mk("cPah", { data: { labels: runs.map((w) => fmtDate(w.date)), datasets: [
      { type: "line", label: "Trend (5 Läufe)", data: roll, borderColor: css("--run"), borderWidth: 2.5, pointRadius: 0, tension: .3 },

}

function drawVolume(metric) {
  charts.cVol?.destroy();
  const weeks = lastWeeks(16), agg = {};
  for (const w of P.ws) { const a = (agg[weekKey(w.date)] ||= {}); const s = a[w.sport] ||= { sec: 0, m: 0, load: 0 }; s.sec += w.durationSec; s.m += w.distanceM || 0; s.load += w.load; }
  const val = (s) => !s ? 0 : metric === "hours" ? s.sec / 3600 : metric === "km" ? s.m / 1000 : s.load;
  const [unit, title] = { hours: ["h", "Stunden"], km: ["km", "Kilometer"], load: ["", "Belastungspunkte (TRIMP)"] }[metric];
  mk("cVol", { type: "bar", data: { labels: weeks.map((w) => fmtDate(w)), datasets: Object.keys(SPORTS).filter((k) => P.ws.some((w) => w.sport === k)).map((k) => ({ label: SPORTS[k].label, data: weeks.map((w) => val(agg[w]?.[k])), backgroundColor: css(SPORTS[k].color), stack: "s" })) },
    options: baseOpts({ scales: { x: { stacked: true, title: ax("Woche ab"), grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } }, y: { stacked: true, title: ax(title) } },
